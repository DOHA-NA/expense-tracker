<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar ">
        <div class="container">
            <span class="navbar-brand fw-bold" > My Expenses</span>
           <button id="themeToggleBtn" class="btn btn-sm btn-outline-light d-flex align-items-center gap-2">
    <i class="bi bi-circle-half"></i>
    <span>Dark Mode</span>
</button>
        </div>
    </nav>

    <div class="container mb-5">

        <div id="alertBox"></div>

        <div class="grid mb-4">
         
                <div class="card stat-1 shadow-sm">
                    <div class="card-body">
                        <h6>Total Spent</h6>
                        <h3 class="fw-bold mb-0" id="totalVal">$0.00</h3>
                  
                </div>
            </div>
            
                <div class="card  stat-2 shadow-sm">
                    <div class="card-body">
                        <h6>Total Items</h6>
                        <h3 class="fw-bold mb-0" id="totalNum">0</h3>
                    </div>
               
            </div>
           
                <div class="card  stat-3 shadow-sm">
                    <div class="card-body">
                        <h6>Most Expensive</h6>
                        <h3 class="fw-bold mb-0" id="maxVal">$0.00</h3>
                   
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">What are my expenses for today?</div>
                    <div class="card-body">
                        <form id="addForm" class="row g-3" novalidate>
                            <div class="col-md-6">
                                <label class="form-label">Title <span class="text-danger"></span></label>
                                <input type="text" class="form-control" id="addTitle" required placeholder="e.g. Coffee">
                                <div class="invalid-feedback">Title is required</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Amount <span class="text-danger"></span></label>
                                <input type="number" step="0.01" class="form-control" id="addAmount" min="0.01" required placeholder="e.g. 5">
                                <div class="invalid-feedback">Enter a valid amount</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="addCategory">
                                    <option value="Food">Food</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Bills">Bills</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other" selected>Other</option>
                                </select>
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary px-4">Add Expense</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold">Filter</div>
                    <div class="card-body d-flex flex-column justify-content-center">
                        <label class="form-label fw-bold">Show Category:</label>
                        <select class="form-select" id="filterSelect">
                            <option value="ALL">All</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center my-5 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Loading...</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white fw-bold">My List
                
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm" novalidate>
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="editTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number" step="0.01" class="form-control" id="editAmount" min="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="editCategory">
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="modal-footer px-0 pb-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>
</body>
</html>
